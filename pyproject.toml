[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "riskframe"
version = "0.1.0.dev0"
description = "Mandate-aware portfolio risk and performance analytics with explicit conventions."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "scipy>=1.10"]
keywords = ["risk", "portfolio", "VaR", "tracking error", "asset management", "quant"]

[project.optional-dependencies]
dev = ["pytest>=7", "hypothesis>=6", "mypy>=1.8", "ruff>=0.4"]

[tool.hatch.build.targets.wheel]
packages = ["src/riskframe"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.mypy]
python_version = "3.10"
strict = true
ignore_missing_imports = true

[tool.ruff]
line-length = 100
src = ["src", "tests"]
